#
# Nginx 反向代理日志抓取配置
#
# 通过 Nginx 做反向代理，在转发请求的同时记录完整的请求和响应信息
#
# 使用方法:
#   1. 将原服务端口从 8280 改为 8281（或其他内部端口）
#   2. 将此配置放入 Nginx 配置中
#   3. Nginx 监听 8280 端口，记录后转发到 8281
#   4. 重启 Nginx: sudo nginx -t && sudo systemctl reload nginx
#
# 日志文件位置: /var/log/nginx/ecg_access.log 和 ecg_request_body.log
#

# 自定义日志格式 - 记录请求详情
log_format ecg_detailed
    '[$time_local] '
    'IP: $remote_addr '
    'Method: $request_method '
    'URI: $request_uri '
    'Status: $status '
    'Body_bytes: $body_bytes_sent '
    'Request_time: ${request_time}s '
    'User-Agent: "$http_user_agent" '
    'Content-Type: "$http_content_type" '
    'Content-Length: "$http_content_length" '
    'Request_Body: "$request_body"';

# 如果 Nginx 是独立配置，需要在 http 块外添加以下内容:
# 取消注释下面的 http 块包裹
# http {
#     include       /etc/nginx/mime.types;
#     default_type  application/octet-stream;

server {
    listen 8280;
    server_name 192.168.100.69;

    # 请求体大小限制（根据心电数据大小调整）
    client_max_body_size 50m;

    # 记录请求体（Nginx 默认不记录）
    # 注意：只对 POST/PUT 等有 body 的请求有效
    lua_need_request_body on;
    # 如果没有 lua 模块，改用以下配置:
    # 在 location 块中使用 mirror 方式

    # 详细访问日志
    access_log /var/log/nginx/ecg_access.log ecg_detailed;
    error_log  /var/log/nginx/ecg_error.log warn;

    # 心电结果回传接口
    location /gw-xtjc/ecg/result {
        # 记录请求体到单独的日志文件
        access_log /var/log/nginx/ecg_request_body.log ecg_detailed;

        # 转发到实际后端服务
        proxy_pass http://127.0.0.1:8281;

        # 保留原始请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $http_content_type;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置（确保大请求体能被完整转发）
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_request_buffering on;
    }

    # 其他路径也转发（可选）
    location / {
        access_log /var/log/nginx/ecg_access.log ecg_detailed;

        proxy_pass http://127.0.0.1:8281;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# } # 结束 http 块
